name: Publish research site
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # External discussion events cannot interrupt an active deployment.
  group: research-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Read and validate live research records
        env:
          GH_TOKEN: ${{ github.token }}
          ARC_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .cache
          python3 -m arc.cli --repo "$ARC_REPOSITORY" sync --output .cache/tasks.json
          python3 -m arc.community --repo "$ARC_REPOSITORY" --output .cache/community.json
      - name: Fetch bounded discussion metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARC_REPOSITORY: ${{ github.repository }}
        run: python3 -m arc.activity --repo "$ARC_REPOSITORY" --output .cache/activity.json
      - name: Build public snapshot
        run: python3 -m arc.site --snapshot .cache/tasks.json --community .cache/community.json --activity .cache/activity.json --output dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
